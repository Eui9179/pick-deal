syntax = "proto3";

option java_package = "com.leui.protobuf";
option java_multiple_files = true;

message UserPointAppliedFailEvent {
  string event_id     = 1;
  string order_id     = 2;
  int64  deal_id      = 3;
  int64  user_id      = 4;
  int32  quantity     = 5;
  string total_amount = 6;
  string used_point   = 7;
  string payment_key  = 8;
  string provider     = 9;
}
