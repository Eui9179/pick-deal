plugins {
    id 'pickdeal-springboot'
}

group = 'com.leui'
version = '0.0.1'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'org.springframework.data:spring-data-redis'
}

test {
    useJUnitPlatform()
}