auth:
  jwt:
    secret-key: YmFzZTY0LWVuY29kZWQtMjU2Yml0LXNlY3JldA
    expiration-time:
      access-token: 5 # minutes
      refresh-token: 15 # days
server:
  port: 8093
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  application:
    name: user-service